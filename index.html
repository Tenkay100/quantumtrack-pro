<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumTrack Pro</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0A0A0A 0%, #1A1A1A 100%);
            color: white;
            min-height: 100vh;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .tracking-card {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            margin-top: 50px;
        }
        input, select {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #FF6B00;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
        }
        .results { margin-top: 20px; padding: 20px; background: rgba(255,255,255,0.1); border-radius: 10px; display: none; }
        .admin-panel { display: none; padding: 20px; }
        .secret { position: fixed; bottom: 10px; left: 10px; font-size: 10px; color: rgba(255,255,255,0.3); cursor: pointer; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1A1A1A;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
        }
        .shipment-item {
            background: #1A1A1A;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: #1A1A1A;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        h1, h2, h3 { margin-bottom: 15px; }
        .error { color: #ff6b6b; }
        .success { color: #4CAF50; }
    </style>
</head>
<body>
    <div class="container" id="publicView">
        <div class="tracking-card">
            <h1 style="text-align:center;">QuantumTrack Pro</h1>
            <p style="text-align:center; margin-bottom:20px;">Track your shipment</p>
            <input type="text" id="trackingNumber" placeholder="Enter tracking number (e.g., QT-78342)">
            <button id="trackBtn">Track Shipment</button>
            <div id="results" class="results"></div>
        </div>
    </div>

    <div class="admin-panel" id="adminView">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1>Admin Dashboard</h1>
            <button id="logoutBtn" style="width:auto; padding:10px 20px;">Exit</button>
        </div>
        
        <div class="stats" id="stats">
            <div class="stat-card"><h3 id="totalCount">0</h3><p>Total</p></div>
            <div class="stat-card"><h3 id="transitCount">0</h3><p>In Transit</p></div>
            <div class="stat-card"><h3 id="deliveredCount">0</h3><p>Delivered</p></div>
        </div>
        
        <button id="addBtn">+ Add Shipment</button>
        <div id="shipmentsList"></div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>Admin Login</h2>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email" required value="understanding80s@gmail.com">
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <!-- Shipment Modal -->
    <div id="shipmentModal" class="modal">
        <div class="modal-content" style="max-width:600px; max-height:80vh; overflow-y:auto;">
            <h2 id="modalTitle">Add Shipment</h2>
            <form id="shipmentForm">
                <input type="text" id="sName" placeholder="Sender Name" required>
                <input type="text" id="sPhone" placeholder="Sender Phone" required>
                <input type="text" id="sAddress" placeholder="Sender Address" required>
                <input type="text" id="rName" placeholder="Recipient Name" required>
                <input type="text" id="rPhone" placeholder="Recipient Phone" required>
                <input type="text" id="rAddress" placeholder="Recipient Address" required>
                <input type="text" id="itemDesc" placeholder="Item Description" required>
                <input type="number" id="weight" placeholder="Weight (kg)" required step="0.1">
                <select id="originCountry" required><option value="">Select Origin Country</option></select>
                <select id="destCountry" required><option value="">Select Destination Country</option></select>
                <select id="status" required>
                    <option value="pending">Pending</option>
                    <option value="in-transit">In Transit</option>
                    <option value="delivered">Delivered</option>
                </select>
                <input type="date" id="estDate" required>
                <button type="submit">Save</button>
                <button type="button" id="closeModalBtn" style="background:#333;">Cancel</button>
            </form>
        </div>
    </div>

    <div class="secret" id="secretArea">QuantumTrack Pro v2.0</div>

    <script>
        // ============ REPLACE THIS WITH YOUR FIREBASE CONFIG ============
        const firebaseConfig = {
  apiKey: "AIzaSyAZcPceyTjeYCaJva1bIsU8ov8URmJqpoI",
  authDomain: "quantumtrackpro-1874c.firebaseapp.com",
  projectId: "quantumtrackpro-1874c",
  storageBucket: "quantumtrackpro-1874c.firebasestorage.app",
  messagingSenderId: "721322000224",
  appId: "1:721322000224:web:588ee698352698c14da805"
};
        // ================================================================

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Countries list
        const countries = ["United States", "Canada", "United Kingdom", "Germany", "France", "China", "Japan", "India", "Australia", "Brazil", "Mexico", "Spain", "Italy", "Netherlands", "Sweden", "Norway", "Denmark", "Finland", "Poland", "Turkey", "UAE", "Saudi Arabia", "South Africa", "Nigeria", "Egypt", "Kenya", "Ghana", "Pakistan", "Bangladesh", "Vietnam", "Thailand", "Malaysia", "Singapore", "Indonesia", "Philippines", "Russia", "Ukraine", "Argentina", "Chile", "Colombia", "Peru", "Venezuela", "New Zealand", "Ireland", "Portugal", "Greece", "Switzerland", "Belgium", "Austria", "Czech Republic", "Hungary", "Romania"];
        countries.sort();

        // Populate country dropdowns
        function populateCountries() {
            const origin = document.getElementById('originCountry');
            const dest = document.getElementById('destCountry');
            origin.innerHTML = '<option value="">Select Origin Country</option>';
            dest.innerHTML = '<option value="">Select Destination Country</option>';
            countries.forEach(c => {
                origin.innerHTML += `<option value="${c}">${c}</option>`;
                dest.innerHTML += `<option value="${c}">${c}</option>`;
            });
        }

        let currentUser = null;
        let shipments = [];
        let editingId = null;

        function showNotification(msg, isError = false) {
            const div = document.createElement('div');
            div.textContent = msg;
            div.style.cssText = `position:fixed; top:20px; right:20px; background:${isError ? '#f44336' : '#4CAF50'}; color:white; padding:15px; border-radius:8px; z-index:9999;`;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        async function loadShipments() {
            try {
                const snapshot = await db.collection('shipments').get();
                shipments = [];
                snapshot.forEach(doc => shipments.push({ id: doc.id, ...doc.data() }));
                if (shipments.length === 0) await loadDemoData();
                updateStats();
                if (currentUser) renderShipments();
            } catch (error) {
                console.error('Load error:', error);
                showNotification('Error loading data: ' + error.message, true);
            }
        }

        async function loadDemoData() {
            const demo = {
                trackingNumber: 'QT-78342',
                senderName: 'John Smith',
                senderPhone: '+1 555-1234',
                senderAddress: 'New York, USA',
                recipientName: 'Jane Doe',
                recipientPhone: '+1 555-5678',
                recipientAddress: 'Los Angeles, USA',
                itemDescription: 'MacBook Pro',
                itemWeight: '2.5',
                originCountry: 'United States',
                destinationCountry: 'Canada',
                status: 'in-transit',
                estimatedDelivery: getFutureDate(7),
                locations: [{ city: 'New York', country: 'USA', date: new Date().toISOString().split('T')[0], status: 'Order received' }]
            };
            await db.collection('shipments').doc('QT-78342').set(demo);
            shipments = [demo];
        }

        function getFutureDate(days) { const d = new Date(); d.setDate(d.getDate() + days); return d.toISOString().split('T')[0]; }
        
        function updateStats() {
            if (!currentUser) return;
            document.getElementById('totalCount').textContent = shipments.length;
            document.getElementById('transitCount').textContent = shipments.filter(s => s.status === 'in-transit').length;
            document.getElementById('deliveredCount').textContent = shipments.filter(s => s.status === 'delivered').length;
        }

        function renderShipments() {
            const container = document.getElementById('shipmentsList');
            if (shipments.length === 0) {
                container.innerHTML = '<p>No shipments yet. Add your first shipment!</p>';
                return;
            }
            container.innerHTML = shipments.map(s => `
                <div class="shipment-item">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
                        <div><strong>${s.trackingNumber}</strong><br><small>${s.senderName} → ${s.recipientName}</small></div>
                        <div><span style="background:${s.status === 'delivered' ? '#4CAF50' : s.status === 'in-transit' ? '#FF9800' : '#2196F3'}; padding:4px 12px; border-radius:20px;">${s.status}</span></div>
                        <div>
                            <button onclick="editShipment('${s.trackingNumber}')" style="background:#FF6B00; border:none; padding:5px 10px; border-radius:5px; color:white; margin-right:5px;">Edit</button>
                            <button onclick="deleteShipment('${s.trackingNumber}')" style="background:#f44336; border:none; padding:5px 10px; border-radius:5px; color:white;">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function trackShipment() {
            const trackingNum = document.getElementById('trackingNumber').value.trim().toUpperCase();
            if (!trackingNum) { showNotification('Enter tracking number', true); return; }
            
            try {
                const doc = await db.collection('shipments').doc(trackingNum).get();
                const results = document.getElementById('results');
                if (doc.exists) {
                    const s = doc.data();
                    const lastLoc = s.locations?.[s.locations.length-1] || { city: 'Unknown', country: 'Unknown' };
                    results.innerHTML = `
                        <h3>Shipment: ${s.trackingNumber}</h3>
                        <p><strong>Status:</strong> ${s.status}</p>
                        <p><strong>From:</strong> ${s.senderName} (${s.senderAddress})</p>
                        <p><strong>To:</strong> ${s.recipientName} (${s.recipientAddress})</p>
                        <p><strong>Item:</strong> ${s.itemDescription}</p>
                        <p><strong>Weight:</strong> ${s.itemWeight} kg</p>
                        <p><strong>Origin:</strong> ${s.originCountry}</p>
                        <p><strong>Destination:</strong> ${s.destinationCountry}</p>
                        <p><strong>Current Location:</strong> ${lastLoc.city}, ${lastLoc.country}</p>
                        <p><strong>Estimated Delivery:</strong> ${s.estimatedDelivery}</p>
                    `;
                    results.style.display = 'block';
                } else {
                    results.style.display = 'none';
                    showNotification('Shipment not found', true);
                }
            } catch (error) {
                showNotification('Error: ' + error.message, true);
            }
        }

        async function saveShipment(e) {
            e.preventDefault();
            const trackingNum = editingId || ('QT-' + Math.floor(10000 + Math.random() * 90000));
            const data = {
                trackingNumber: trackingNum,
                senderName: document.getElementById('sName').value,
                senderPhone: document.getElementById('sPhone').value,
                senderAddress: document.getElementById('sAddress').value,
                recipientName: document.getElementById('rName').value,
                recipientPhone: document.getElementById('rPhone').value,
                recipientAddress: document.getElementById('rAddress').value,
                itemDescription: document.getElementById('itemDesc').value,
                itemWeight: document.getElementById('weight').value,
                originCountry: document.getElementById('originCountry').value,
                destinationCountry: document.getElementById('destCountry').value,
                status: document.getElementById('status').value,
                estimatedDelivery: document.getElementById('estDate').value,
                locations: editingId ? (shipments.find(s => s.trackingNumber === editingId)?.locations || []) : [{ city: 'Origin', country: document.getElementById('originCountry').value, date: new Date().toISOString().split('T')[0], status: 'Order received' }]
            };
            
            try {
                await db.collection('shipments').doc(trackingNum).set(data);
                showNotification(`Shipment ${editingId ? 'updated' : 'added'}! Tracking: ${trackingNum}`);
                document.getElementById('shipmentModal').classList.remove('active');
                loadShipments();
            } catch (error) {
                showNotification('Error: ' + error.message, true);
            }
        }

        window.editShipment = async (id) => {
            const shipment = shipments.find(s => s.trackingNumber === id);
            if (!shipment) return;
            editingId = id;
            document.getElementById('modalTitle').textContent = 'Edit Shipment';
            document.getElementById('sName').value = shipment.senderName;
            document.getElementById('sPhone').value = shipment.senderPhone;
            document.getElementById('sAddress').value = shipment.senderAddress;
            document.getElementById('rName').value = shipment.recipientName;
            document.getElementById('rPhone').value = shipment.recipientPhone;
            document.getElementById('rAddress').value = shipment.recipientAddress;
            document.getElementById('itemDesc').value = shipment.itemDescription;
            document.getElementById('weight').value = parseFloat(shipment.itemWeight);
            document.getElementById('originCountry').value = shipment.originCountry;
            document.getElementById('destCountry').value = shipment.destinationCountry;
            document.getElementById('status').value = shipment.status;
            document.getElementById('estDate').value = shipment.estimatedDelivery;
            document.getElementById('shipmentModal').classList.add('active');
        };

        window.deleteShipment = async (id) => {
            if (!confirm('Delete this shipment?')) return;
            try {
                await db.collection('shipments').doc(id).delete();
                showNotification('Shipment deleted');
                loadShipments();
            } catch (error) {
                showNotification('Error: ' + error.message, true);
            }
        };

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (email !== 'understanding80s@gmail.com') {
                showNotification('Access denied. Only authorized admin.', true);
                return;
            }
            
            try {
                const result = await auth.signInWithEmailAndPassword(email, password);
                currentUser = result.user;
                document.getElementById('loginModal').classList.remove('active');
                document.getElementById('publicView').style.display = 'none';
                document.getElementById('adminView').style.display = 'block';
                showNotification('Welcome Admin!');
                loadShipments();
            } catch (error) {
                if (error.code === 'auth/user-not-found') {
                    try {
                        const result = await auth.createUserWithEmailAndPassword(email, password);
                        currentUser = result.user;
                        document.getElementById('loginModal').classList.remove('active');
                        document.getElementById('publicView').style.display = 'none';
                        document.getElementById('adminView').style.display = 'block';
                        showNotification('Admin account created!');
                        loadShipments();
                    } catch (createError) {
                        showNotification('Error: ' + createError.message, true);
                    }
                } else {
                    showNotification('Login failed: ' + error.message, true);
                }
            }
        }

        function logout() {
            auth.signOut();
            currentUser = null;
            document.getElementById('publicView').style.display = 'block';
            document.getElementById('adminView').style.display = 'none';
            showNotification('Logged out');
        }

        // Secret admin access (triple click)
        let clickCount = 0;
        document.getElementById('secretArea').addEventListener('click', () => {
            clickCount++;
            setTimeout(() => clickCount = 0, 1000);
            if (clickCount === 3) {
                document.getElementById('loginModal').classList.add('active');
                clickCount = 0;
            }
        });

        // Event listeners
        document.getElementById('trackBtn').addEventListener('click', trackShipment);
        document.getElementById('addBtn').addEventListener('click', () => {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Add Shipment';
            document.getElementById('shipmentForm').reset();
            document.getElementById('estDate').value = getFutureDate(7);
            document.getElementById('shipmentModal').classList.add('active');
        });
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('loginForm').addEventListener('submit', handleLogin);
        document.getElementById('shipmentForm').addEventListener('submit', saveShipment);
        document.getElementById('closeModalBtn').addEventListener('click', () => document.getElementById('shipmentModal').classList.remove('active'));
        
        // Close modals on outside click
        document.getElementById('loginModal').addEventListener('click', (e) => { if (e.target === document.getElementById('loginModal')) document.getElementById('loginModal').classList.remove('active'); });
        document.getElementById('shipmentModal').addEventListener('click', (e) => { if (e.target === document.getElementById('shipmentModal')) document.getElementById('shipmentModal').classList.remove('active'); });
        
        // Auth state
        auth.onAuthStateChanged((user) => {
            if (user && user.email === 'understanding80s@gmail.com') {
                currentUser = user;
                document.getElementById('publicView').style.display = 'none';
                document.getElementById('adminView').style.display = 'block';
                loadShipments();
            }
        });
        
        // Initialize
        populateCountries();
        document.getElementById('estDate').value = getFutureDate(7);
        loadShipments();
    </script>
</body>
</html>
